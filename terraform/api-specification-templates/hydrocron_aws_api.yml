openapi: 3.0.0
info:
  title: "Hydrocron"
  description: "Get time series data from SWOT observations for reaches and nodes"
  version: ${software_version}
servers:
- url: https://virtserver.swaggerhub.com/hydrocron/${api_version}
  description: "Get time series data from SWOT observations for reaches and nodes"
paths:
  /timeseries:
    get:
      summary: "Get Timeseries for a particular Reach, Node, or LakeID"
      description: "Get Timeseries for a particular Reach, Node, or LakeID"
      operationId: timeseries_get
      security:
      - ${authorizer_name}: []
      parameters:
      - name: feature
        in: query
        description: Type of feature being requested
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum: [ "Reach", "Node", "PriorLake"]
        example: Reach
      - name: feature_id
        in: query
        description: ID of the feature to retrieve in format CBBTTTSNNNNNN (i.e. 74297700000000)
        required: true
        style: form
        explode: true
        schema:
          type: string
        example: 71224100223
      - name: start_time
        in: query
        description: Start time of the timeseries
        required: true
        style: form
        explode: true
        schema:
          type: string
          format: date-time
        example: 2022-08-04T00:00:00Z
      - name: end_time
        in: query
        description: End time of the timeseries
        required: true
        style: form
        explode: true
        schema:
          type: string
          format: date-time
        example: 2022-08-23T00:00:00Z
      - name: output
        in: query
        description: Format of the data returned
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum: [ "csv", "geojson", "csv_file"]
          default: geojson
        example: geojson
      - name: fields
        in: query
        description: Format of the data returned
        required: true
        style: form
        explode: true
        schema:
          type: string
          default: feature_id, time_str, wse, geometry
        example: feature_id, time_str, wse, geometry
      - name: node_fields
        in: query
        description: Node fields to return with the reach's nodes. Only valid when feature=Reach; its presence adds the reach's node data to the response
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: node_id,time_str,wse,node_q
      - name: compact
        in: query
        description: Whether to return a compact GeoJSON response
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - name: filename
        in: query
        description: Custom filename for CSV file download (used with output=csv_file)
        required: false
        schema:
          type: string
        example: my_swot_data.csv
      - name: collection_name
        in: query
        description: Name of collection to query data for
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum: [ "SWOT_L2_HR_RiverSP_2.0", "SWOT_L2_HR_RiverSP_D", "SWOT_L2_HR_LakeSP_2.0", "SWOT_L2_HR_LakeSP_D" ]
        example: SWOT_L2_HR_RiverSP_D
      responses:
        "200":
          description: OK
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
            Content-Disposition:
              schema:
                type: "string"
            Access-Control-Expose-Headers:
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json'
            text/csv:
              schema:
                $ref: '#/components/schemas/csv'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/geojson'
        "400":
          description: "400 error. The specified URL is invalid (does not exist)."
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            text/csv:
              schema:
                type: array
                items:
                  type: string
        "404":
          description: "404 error. An entry with the specified region was not found."
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            text/csv:
              schema:
                type: array
                items:
                  type: string
        "413":
          description: "413 error. Your query has returned is too large."
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            text/csv:
              schema:
                type: array
                items:
                  type: string
        "415":
          description: "415 error. Your request includes an unsupported media type."
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
          content:
            text/csv:
              schema:
                type: array
                items:
                  type: string
        "500":
          description: "500 error. Internal error; the message has a request ID to report."
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
        "503":
          description: "503 error. Service busy; retry in a few seconds."
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
      x-openapi-router-controller: hydrocron_api.controllers.timeseries

      x-amazon-apigateway-integration:
        uri: ${hydrocron_api_lambda_arn_timeseries}
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |
                #set($inputRoot = $input.path('$'))
                #set($isDownload = $input.path('$.__hydrocron_download__'))
                #if($isDownload == true)
                #set($context.responseOverride.header.Content-Type = 'text/csv')
                #set($context.responseOverride.header.Access-Control-Expose-Headers = 'Content-Disposition')
                #set($fn = $input.path('$.filename'))
                #set($context.responseOverride.header.Content-Disposition = "attachment; filename=$fn")
                $input.path('$.csv_data')
                #else
                #if($inputRoot.toString().contains('206 PARTIAL CONTENT'))
                  #set($context.responseOverride.status = 206)
                #end
                $input.json('$')
                #end
              application/geo+json: |
                #set($inputRoot = $input.path('$'))
                #if($inputRoot.toString().contains('206 PARTIAL CONTENT'))
                  #set($context.responseOverride.status = 206)
                #end
                $input.json('$')
              text/csv: |
                #set($inputRoot = $input.path('$'))
                #if($inputRoot.toString().contains('206 PARTIAL CONTENT'))
                  #set($context.responseOverride.status = 206)
                #end
                $input.body
          ^400.*:
            statusCode: "400"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |-
                {
                  "error" : "$input.path('$.errorMessage')"
                }
          ^404.*:
            statusCode: "404"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |-
                {
                  "error" : "$input.path('$.errorMessage')"
                }
          ^413.*:
            statusCode: "413"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |-
                {
                  "error" : "$input.path('$.errorMessage')"
                }
          ^415.*:
            statusCode: "415"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |-
                {
                  "error" : "$input.path('$.errorMessage')"
                }
          ^503.*:
            statusCode: "503"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              application/json: |-
                {
                  "error" : "$input.path('$.errorMessage')"
                }
          # One entry per status code: API Gateway keeps only one integration response per status.
          # 500 = our "500: ..." messages, plus any message not starting with 1-5 (Lambda runtime errors).
          # (?s): runtime errors can be multiline; without it "." stops at a newline and the default (200) wins.
          "(?s)^(500|[^1-5]).*":
            statusCode: "500"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            responseTemplates:
              # Our 500s are JSON-escaped by the Lambda: echo them. Raw runtime errors aren't (and may hold
              # internal detail): return a fixed message with API Gateway's request ID instead.
              application/json: |-
                #set($msg = $input.path('$.errorMessage'))
                #if($msg.startsWith('500:'))
                {
                  "error" : "$msg"
                }
                #else
                {
                  "error" : "500: Internal error (request ID $context.requestId). Please report it at https://github.com/podaac/hydrocron/issues."
                }
                #end
        requestTemplates:
          application/json: |-
            #set($queryParams = $input.params().querystring)
            #set($headerParams = $input.params().header)
            {
              "body" :
              {
                #foreach($paramName in $queryParams.keySet())
                "$paramName": "$util.escapeJavaScript($queryParams.get($paramName))"
                  #if($foreach.hasNext),#end
                #end
              },
              "headers" : 
              {
                #foreach($header in $headerParams.keySet())
                "$header": "$util.escapeJavaScript($input.params().header.get($header))" 
                  #if($foreach.hasNext),#end
                #end
              }
            }
        passthroughBehavior: when_no_templates
        httpMethod: POST
        contentHandling: CONVERT_TO_TEXT
        type: aws
    options:
      summary: CORS support
      description: |
        Enable CORS by returning correct headers
      tags:
      - CORS
      responses:
        200:
          description: Default response for CORS method
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: "string"
            Access-Control-Allow-Methods:
              schema:
                type: "string"
            Access-Control-Allow-Headers:
              schema:
                type: "string"
            Access-Control-Expose-Headers:
              schema:
                type: "string"
          content: {}
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: "{\"statusCode\": 200}"
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'*'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Expose-Headers: "'Content-Disposition'"
x-amazon-apigateway-api-key-source: "AUTHORIZER"
components:
  schemas:
    json:
      type: object
    geojson:
      type: object
    csv:
      type: object
  securitySchemes:
    ${authorizer_name}:
      type: apiKey
      name: x-hydrocron-key
      in: header
      x-amazon-apigateway-authorizer:
        type: request
        identitySource: method.request.header.User-Agent
        authorizerUri: ${authorizer_url}
        authorizerCredentials: ${authorizer_credentials}
        authorizerPayloadFormatVersion: '1.0'
        authorizerResultTtlInSeconds: 0
      x-amazon-apigateway-authtype: custom
